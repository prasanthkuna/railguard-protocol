name: Release SDK

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: railguard-protocol
      - uses: actions/checkout@v4
        with:
          repository: prasanthkuna/x402-guard
          path: x402-guard
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Build dependency packages
        run: cd x402-guard && npm ci && npm run build
      - name: Install SDK from packed deps
        run: |
          cd x402-guard
          CORE_PACK=$(npm pack -w @railguard/x402-core --silent)
          POLICY_PACK=$(npm pack -w @railguard/x402-policy --silent)
          RECEIPTS_PACK=$(npm pack -w @railguard/x402-receipts --silent)
          MW_PACK=$(npm pack -w @railguard/x402 --silent)
          cd ../railguard-protocol/sdk
          npm install "../../x402-guard/${CORE_PACK}" "../../x402-guard/${POLICY_PACK}" "../../x402-guard/${RECEIPTS_PACK}" "../../x402-guard/${MW_PACK}"
      - name: Test and build
        run: cd railguard-protocol/sdk && npm test && npm run build
      - name: Publish @railguard/sdk
        working-directory: railguard-protocol/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
